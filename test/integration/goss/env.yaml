package:
  git:
    installed: true

file:
  /mnt/caramelo/apps:
    exists: true
    filetype: directory
    owner: caramelo
    group: caramelo
  /mnt/caramelo/apps/sampleapp:
    exists: true
    filetype: directory
    owner: caramelo
    group: caramelo
    mode: "0750"
  /mnt/caramelo/apps/sampleapp/repo.git:
    exists: true
    filetype: directory
    owner: caramelo
    group: caramelo
  /mnt/caramelo/apps/sampleapp/repo.git/HEAD:
    exists: true
    filetype: file
    owner: caramelo
    contents:
      - '/^ref: refs\/heads\/main$/'
  /mnt/caramelo/apps/sampleapp/repo.git/objects:
    exists: true
    filetype: directory
    owner: caramelo
  /mnt/caramelo/apps/sampleapp/repo.git/hooks/push-to-checkout:
    exists: true
    filetype: file
    owner: caramelo
    group: caramelo
    mode: "0755"
    contents:
      - /read-tree -u -m/
      - /refusing to update/

  /mnt/caramelo/apps/sampleapp/envs/feat-x:
    exists: true
    filetype: directory
    owner: caramelo
    group: caramelo
  /mnt/caramelo/apps/sampleapp/envs/feat-x/src:
    exists: true
    filetype: directory
    owner: caramelo
    group: caramelo
  /mnt/caramelo/apps/sampleapp/envs/feat-x/src/.git:
    exists: true
    filetype: file
    owner: caramelo
    contents:
      - '/^gitdir: \/mnt\/caramelo\/apps\/sampleapp\/repo\.git\/worktrees\//'
  /mnt/caramelo/apps/sampleapp/envs/feat-x/src/caramelo.yaml:
    exists: true
    filetype: file
    owner: caramelo

command:
  sudo -u caramelo git -C /mnt/caramelo/apps/sampleapp/repo.git config --local --get receive.denyCurrentBranch:
    exit-status: 0
    stdout:
      - updateInstead
  sudo -u caramelo git -C /mnt/caramelo/apps/sampleapp/repo.git worktree list:
    exit-status: 0
    stdout:
      - /mnt/caramelo/apps/sampleapp/envs/feat-x/src
      - "[feat-x]"
  sudo -u caramelo env XDG_RUNTIME_DIR=/run/user/$(id -u caramelo) DOCKER_HOST=unix:///run/user/$(id -u caramelo)/docker.sock docker inspect caramelo-sampleapp-feat-x-db:
    exit-status: 0
    stdout:
      - '/"Status": "running"/'
      - '/"caramelo.app": "sampleapp"/'
      - '/"caramelo.env": "feat-x"/'
      - '/"caramelo.dep": "db"/'
      - '/"HostIp": "127.0.0.1"/'
      - '/"Name": "unless-stopped"/'
  sudo -u caramelo env XDG_RUNTIME_DIR=/run/user/$(id -u caramelo) DOCKER_HOST=unix:///run/user/$(id -u caramelo)/docker.sock docker inspect caramelo-sampleapp-feat-x-cache:
    exit-status: 0
    stdout:
      - '/"Status": "running"/'
      - '/"caramelo.app": "sampleapp"/'
      - '/"caramelo.env": "feat-x"/'
      - '/"caramelo.dep": "cache"/'
      - '/"HostIp": "127.0.0.1"/'
      - '/"Name": "unless-stopped"/'
  sudo -u caramelo env XDG_RUNTIME_DIR=/run/user/$(id -u caramelo) DOCKER_HOST=unix:///run/user/$(id -u caramelo)/docker.sock docker ps --filter label=caramelo.env=feat-x:
    exit-status: 0
    stdout:
      - "127.0.0.1:"
      - "!0.0.0.0"
  sudo -u caramelo env XDG_RUNTIME_DIR=/run/user/$(id -u caramelo) DOCKER_HOST=unix:///run/user/$(id -u caramelo)/docker.sock docker volume ls -q --filter label=caramelo.env=feat-x:
    exit-status: 0
    stdout:
      - caramelo-sampleapp-feat-x-db
      - caramelo-sampleapp-feat-x-cache
      - caramelo-sampleapp-feat-x--cache
